<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-label="Node-Graph: Ein Spieler läuft durch verbundene Fotos der Schule">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#1b1036"/>
      <stop offset="1" stop-color="#07071a"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="route" d="M450,370 L450,230 L450,90 L450,230 L230,230 L450,230 L670,230 L450,230 L450,370"/>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .edge { stroke: #a78bfa; stroke-width: 3; stroke-dasharray: 8 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .node { fill: #111827; stroke-width: 3; }
    .label { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
    .sub { fill: #94a3b8; font-size: 13px; }
    .dir { fill: #c4b5fd; font-size: 13px; }
    .wall { fill: #f87171; font-size: 13px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="440" rx="16" fill="url(#bg)"/>
  <text class="mono" x="24" y="34" fill="#facc15" font-size="15" font-weight="700">WORLD MAP · nodes</text>

  <!-- Verbindungen -->
  <g>
    <line class="edge" x1="450" y1="340" x2="450" y2="260"/>
    <line class="edge" x1="450" y1="200" x2="450" y2="120"/>
    <line class="edge" x1="380" y1="230" x2="300" y2="230"/>
    <line class="edge" x1="520" y1="230" x2="600" y2="230"/>
  </g>
  <g class="mono dir">
    <text x="460" y="305">forward</text>
    <text x="460" y="165">forward</text>
    <text x="312" y="220">left</text>
    <text x="548" y="220">right</text>
  </g>

  <!-- Nodes -->
  <g class="mono" text-anchor="middle">
    <rect class="node" x="380" y="340" width="140" height="60" rx="10" stroke="#facc15"/>
    <text class="label" x="450" y="368">🏫 Eingang</text>
    <text class="sub" x="450" y="388">id 1 · hallway</text>

    <rect class="node" x="380" y="200" width="140" height="60" rx="10" stroke="#a78bfa"/>
    <text class="label" x="450" y="228">🚶 Gang</text>
    <text class="sub" x="450" y="248">id 2 · hallway</text>

    <rect class="node" x="380" y="60" width="140" height="60" rx="10" stroke="#22d3ee"/>
    <text class="label" x="450" y="88">🪜 Stiege</text>
    <text class="sub" x="450" y="108">id 3 · stairwell</text>

    <rect class="node" x="160" y="200" width="140" height="60" rx="10" stroke="#4ade80"/>
    <text class="label" x="230" y="228">💻 EDV-Saal</text>
    <text class="sub" x="230" y="248">id 4 · room</text>

    <rect class="node" x="600" y="200" width="140" height="60" rx="10" stroke="#fb923c"/>
    <text class="label" x="670" y="228">🔬 Labor</text>
    <text class="sub" x="670" y="248">id 5 · room</text>
  </g>

  <!-- Sackgassen -->
  <g class="mono wall" text-anchor="middle">
    <text x="230" y="290">🧱 left = null</text>
    <text x="670" y="290">🧱 right = null</text>
  </g>

  <!-- Spieler -->
  <g filter="url(#glow)">
    <circle r="16" fill="none" stroke="#facc15" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="12;22;12" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.4s" repeatCount="indefinite"/>
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"><mpath href="#route"/></animateMotion>
    </circle>
    <circle r="9" fill="#facc15">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear"><mpath href="#route"/></animateMotion>
    </circle>
  </g>

  <text class="mono" x="876" y="420" fill="#64748b" font-size="13" text-anchor="end">● = du</text>
</svg>
