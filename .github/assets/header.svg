<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="HTL OS – Ein interaktiver 3D-Rundgang durch die HTL Villach">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.7" stop-color="#1b0b33"/>
      <stop offset="1" stop-color="#2a0f3d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f3d" stop-opacity="1"/>
      <stop offset="1" stop-color="#2a0f3d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="floorClip"><rect x="0" y="215" width="900" height="85"/></clipPath>
    <clipPath id="typeClip">
      <rect x="0" y="168" height="40" width="0">
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;0.45;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .floor { animation: floor 1.2s linear infinite; }
    @keyframes floor { from { transform: translateY(0); } to { transform: translateY(14px); } }
    .g1 { animation: g1 3.5s steps(1) infinite; }
    .g2 { animation: g2 3.5s steps(1) infinite; }
    @keyframes g1 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 89% { transform: translate(-6px,2px); opacity: .8; } 92% { transform: translate(5px,-3px); opacity: .8; } 95% { transform: translate(-3px,0); opacity: .8; } }
    @keyframes g2 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 90% { transform: translate(6px,-2px); opacity: .8; } 93% { transform: translate(-5px,3px); opacity: .8; } 96% { transform: translate(3px,1px); opacity: .8; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,55% { opacity: 1; } 56%,100% { opacity: 0; } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="300" fill="url(#bg)"/>

  <!-- Sterne -->
  <g fill="#fde68a">
    <rect class="star" x="80" y="40" width="3" height="3"/>
    <rect class="star" x="170" y="110" width="2" height="2" style="animation-delay:.6s"/>
    <rect class="star" x="260" y="30" width="3" height="3" style="animation-delay:1.2s"/>
    <rect class="star" x="640" y="45" width="3" height="3" style="animation-delay:.3s"/>
    <rect class="star" x="720" y="120" width="2" height="2" style="animation-delay:1.8s"/>
    <rect class="star" x="820" y="60" width="3" height="3" style="animation-delay:.9s"/>
    <rect class="star" x="560" y="20" width="2" height="2" style="animation-delay:2.1s"/>
    <rect class="star" x="350" y="70" width="2" height="2" style="animation-delay:1.5s"/>
  </g>

  <!-- Retro-Gitterboden -->
  <g clip-path="url(#floorClip)" stroke="#f43f5e" stroke-opacity="0.55" stroke-width="1">
    <g class="floor">
      <line x1="0" y1="205" x2="900" y2="205"/>
      <line x1="0" y1="219" x2="900" y2="219"/>
      <line x1="0" y1="233" x2="900" y2="233"/>
      <line x1="0" y1="247" x2="900" y2="247"/>
      <line x1="0" y1="261" x2="900" y2="261"/>
      <line x1="0" y1="275" x2="900" y2="275"/>
      <line x1="0" y1="289" x2="900" y2="289"/>
      <line x1="0" y1="303" x2="900" y2="303"/>
    </g>
    <line x1="450" y1="215" x2="450" y2="300"/>
    <line x1="450" y1="215" x2="330" y2="300"/>
    <line x1="450" y1="215" x2="570" y2="300"/>
    <line x1="450" y1="215" x2="200" y2="300"/>
    <line x1="450" y1="215" x2="700" y2="300"/>
    <line x1="450" y1="215" x2="60" y2="300"/>
    <line x1="450" y1="215" x2="840" y2="300"/>
    <line x1="450" y1="215" x2="-100" y2="300"/>
    <line x1="450" y1="215" x2="1000" y2="300"/>
  </g>
  <rect x="0" y="215" width="900" height="30" fill="url(#floorFade)"/>

  <!-- Titel mit Glitch -->
  <g class="mono" font-size="104" font-weight="900" text-anchor="middle" letter-spacing="14">
    <text class="g1" x="450" y="140" fill="#22d3ee">HTL OS</text>
    <text class="g2" x="450" y="140" fill="#e879f9">HTL OS</text>
    <text x="450" y="140" fill="url(#title)" filter="url(#glow)">HTL OS</text>
  </g>

  <!-- Tipp-Untertitel -->
  <g clip-path="url(#typeClip)">
    <text class="mono" x="450" y="195" font-size="20" fill="#e2e8f0" text-anchor="middle">&gt; Ein interaktiver 3D-Rundgang durch die HTL Villach_</text>
  </g>

  <!-- PRESS START -->
  <text class="mono blink" x="450" y="268" font-size="22" font-weight="700" fill="#facc15" text-anchor="middle" filter="url(#glow)" letter-spacing="4">▶ PRESS START</text>

  <rect width="900" height="300" fill="url(#scan)"/>
</svg>
